name: "One-off: create Vectorize index"
on:
  workflow_dispatch: {}
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Create index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@4 vectorize create documesh-chunks --dimensions=768 --metric=cosine 2>&1 || true
          npx -y wrangler@4 vectorize list 2>&1 | tail -5
