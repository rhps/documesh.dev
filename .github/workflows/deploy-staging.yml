name: Deploy Staging

on:
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/deploy-staging.yml"


concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Staging (auto on merge to main)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Fail-closed gates (never ship a broken mesh)
        run: |
          python3 indexer/verify.py
          node worker/eval.mjs

      - name: Deploy to staging (custom domain)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging

      - name: Smoke test staging
        run: |
          HOST="https://documesh.selatan.org"
          # Fallback to workers.dev if the custom domain is still propagating
          ALT="https://documesh-api.${{ vars.CF_SUBDOMAIN }}.workers.dev"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$HOST/health" || true)
            [ "$CODE" = "200" ] && { echo "✅ staging healthy ($HOST):"; cat /tmp/health.json; exit 0; }
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$ALT/health" || true)
            [ "$CODE" = "200" ] && { echo "✅ staging healthy via workers.dev (custom domain may still be certifying):"; cat /tmp/health.json; exit 0; }
            echo "attempt $i: custom=$HOST / alt=$ALT — retrying in 10s"; sleep 10
          done
          echo "❌ staging smoke failed"; exit 1


      - name: Summary
        run: |
          {
            echo "## 🚀 Staging deployed"
            echo ""
            echo "- URL: https://documesh.selatan.org"
            echo "- Commit: ${{ github.sha }}"
            echo "- Snapshot: $(python3 -c "import json; print(json.load(open('data/snapshot.json'))['built_at'])")"
            echo "- WebMCP evals: smoke passed ✅"
          } >> "$GITHUB_STEP_SUMMARY"
